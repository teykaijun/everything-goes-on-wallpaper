<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Everything Goes On Ã‚Â· TFT Arena</title>
  <link rel="stylesheet" href="style.css?v=3.0.0-final">
  <link rel="stylesheet" href="classroom.css?v=3.0.0-final">
</head>
<body>
  <main id="arena" aria-label="Everything Goes On arena wallpaper">
    <canvas id="ambient" aria-hidden="true"></canvas>
    <div id="arena-scene">
      <video id="day" loop playsinline preload="none" disablepictureinpicture aria-hidden="true"></video>
      <video id="night" loop playsinline preload="none" disablepictureinpicture aria-hidden="true"></video>
    </div>
    <div id="classroom-desks" aria-hidden="true"></div>
    <div id="lux-layer" aria-hidden="true"></div>
    <audio id="day-audio" loop preload="none"></audio>
    <audio id="night-audio" loop preload="none"></audio>
  </main>
  <nav id="lux-emotes" data-lux-ui aria-label="Lux emotes">
    <button id="emote-toggle" aria-label="Show Lux emotes" aria-expanded="false" title="Lux emotes">&#10022;</button>
    <div id="emote-menu" hidden>
      <button data-emote="dance">Dance</button><button data-emote="laugh">Laugh</button>
      <button data-emote="taunt">Taunt</button><button data-emote="joke">Joke</button>
      <button data-emote="stop">Rest</button>
    </div>
  </nav>
  <aside id="preview-panel" hidden aria-label="Wallpaper preview settings">
    <p class="eyebrow">TEAMFIGHT TACTICS / ARENA</p>
    <h1>Everything<br>Goes On</h1>
    <p class="subtitle">A little daylight. A sky full of stars.</p>
    <div class="status-line"><span id="phase-dot"></span><span id="phase-label">Loading arena</span><time id="clock"></time></div>
    <label for="mode">Theme</label>
    <select id="mode"><option value="automatic">Follow local time</option><option value="day">Day</option><option value="night">Night</option></select>
    <div class="schedule-inputs">
      <div><label for="day-start">Day begins</label><input id="day-start" type="time" value="07:00"></div>
      <div><label for="night-start">Night begins</label><input id="night-start" type="time" value="19:00"></div>
    </div>
    <label for="volume">Soundtrack <output id="volume-value">21%</output></label>
    <input id="volume" type="range" min="0" max="100" value="21">
    <label for="transition">Transition <output id="transition-value">8s</output></label>
    <input id="transition" type="range" min="0" max="60" value="8">
    <label class="lux-toggle"><input id="lux-enabled" type="checkbox" checked> Chibi Star Guardian Lux</label>
    <label for="lux-size">Lux size</label><input id="lux-size" type="range" min="65" max="160" value="100">
    <button id="enable-audio" type="button" hidden>Enable soundtrack</button>
    <p id="media-status" role="status"></p>
    <p class="footnote">Preview controls are hidden on your desktop.<br>Use your wallpaper app's settings to save changes.</p>
  </aside>
  <script src="config.js?v=3.0.0-final"></script>
  <script src="schedule.js?v=3.0.0-final"></script>
  <script src="viewport.js?v=3.0.0-final"></script>
  <script src="layout.js?v=3.0.0-final"></script>
  <script src="bench-layout.js?v=3.0.0-final"></script>
  <script src="classroom-geometry.js?v=3.0.0-final"></script>
  <script src="classroom.js?v=3.0.0-final"></script>
  <script src="lux-motion.js?v=3.0.0-final"></script>
  <script src="media/lux/model.js?v=3.0.0-final"></script>
  <script src="media/lux/animation-data.js?v=3.0.0-final"></script>
  <script src="lux.js?v=3.0.0-final"></script>
  <script src="wallpaper.js?v=3.0.0-final"></script>
</body>
</html>
